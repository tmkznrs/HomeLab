config:
  core.https_address: ""
networks:
- name: "lxdbr0"
  type: bridge
  config:
    ipv4.address: 10.10.0.1/24
    ipv4.nat: "true"
    ipv6.address: none
    ipv6.nat: "false"
    dns.mode: managed
storage_pools:
- name: default
  driver: dir
profiles:
- name: default
  devices:
    eth0:
      name: eth0
      network: "lxdbr0"
      type: nic
    root:
      path: /
      pool: default
      type: disk
projects: []
cluster: null

      # === Hubble ===
      - model: authentik_core.application
        state: present
        identifiers:
          slug: "hubble"
        attrs:
          name: "Hubble"
          slug: "hubble"
          meta_launch_url: "https://homelab.local/hubble/"
          meta_icon: "https://cilium.io/static/hubble-light-1-812e65cbb72a7f4efed59fcea48df840.svg"

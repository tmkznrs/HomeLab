authentik:
  secret_key: "<AUTHENTIK_SECRET_KEY>"
  bootstrap_password: "<BOOTSTRAP_PASSWORD>"
  bootstrap_token: "<BOOTSTRAP_TOKEN>"
  postgresql:
    host: "postgres-cluster-rw.database.svc"
    name: authentik
    user: authentik
    password: "authentik12345"
  redis:
    host: "{{ .Release.Name }}-redis-master"

server:
  env:
    - name: AUTHENTIK_WEB__PATH
      value: "/authentik/"
  startupProbe:
    httpGet:
      path: /authentik/-/health/live/
      port: http
  readinessProbe:
    httpGet:
      path: /authentik/-/health/ready/
      port: http
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    httpGet:
      path: /authentik/-/health/live/
      port: http
    timeoutSeconds: 5
    failureThreshold: 5
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

worker:
  readinessProbe:
    exec:
      command: [ak, healthcheck]
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    exec:
      command: [ak, healthcheck]
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

blueprints:
  configMaps:
    - authentik-blueprints

postgresql:
  enabled: false

redis:
  enabled: true
  master:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-config
  namespace: database
data:
  config_local.py: |
    import os
    AUTHENTICATION_SOURCES = ['oauth2', 'internal']
    OAUTH2_AUTO_CREATE_USER = True
    OAUTH2_CONFIG = [{
        'OAUTH2_NAME': 'authentik',
        'OAUTH2_DISPLAY_NAME': 'Login with Authentik',
        'OAUTH2_CLIENT_ID': os.environ.get('OAUTH2_CLIENT_ID', ''),
        'OAUTH2_CLIENT_SECRET': os.environ.get('OAUTH2_CLIENT_SECRET', ''),
        'OAUTH2_SERVER_METADATA_URL': 'http://authentik-server.infra.svc/authentik/application/o/pgadmin/.well-known/openid-configuration',
        'OAUTH2_TOKEN_URL': 'http://authentik-server.infra.svc/authentik/application/o/token/',
        'OAUTH2_AUTHORIZATION_URL': 'https://homelab.local/authentik/application/o/authorize/',
        'OAUTH2_USERINFO_ENDPOINT': 'http://authentik-server.infra.svc/authentik/application/o/userinfo/',
        'OAUTH2_SCOPE': 'openid email profile',
        'OAUTH2_ICON': 'fa-lock',
        'OAUTH2_BUTTON_COLOR': '#fd4b2d',
    }]

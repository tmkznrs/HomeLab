apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mimir-alerts
  namespace: observability
spec:
  groups:
    - name: node.alerts
      rules:
        - alert: NodeMemoryHigh
          expr: |
            sum(container_memory_working_set_bytes{container!=""}) by (node)
            / sum(kube_node_status_allocatable{resource="memory", unit="byte"}) by (node)
            * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node memory usage high: {{ $labels.node }}"
            description: "Memory usage is {{ $value | humanize }}% (threshold: 80%)"
        - alert: NodeMemoryCritical
          expr: |
            sum(container_memory_working_set_bytes{container!=""}) by (node)
            / sum(kube_node_status_allocatable{resource="memory", unit="byte"}) by (node)
            * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node memory usage critical: {{ $labels.node }}"
            description: "Memory usage is {{ $value | humanize }}% (threshold: 90%)"
        - alert: NodeCPUHigh
          expr: |
            sum(irate(container_cpu_usage_seconds_total{container!=""}[2m])) by (node)
            / sum(kube_node_status_allocatable{resource="cpu", unit="core"}) by (node)
            * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU usage high: {{ $labels.node }}"
            description: "CPU usage is {{ $value | humanize }}% (threshold: 80%)"
        - alert: NodeCPUCritical
          expr: |
            sum(irate(container_cpu_usage_seconds_total{container!=""}[2m])) by (node)
            / sum(kube_node_status_allocatable{resource="cpu", unit="core"}) by (node)
            * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node CPU usage critical: {{ $labels.node }}"
            description: "CPU usage is {{ $value | humanize }}% (threshold: 90%)"

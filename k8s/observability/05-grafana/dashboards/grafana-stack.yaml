apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: mimir-overview
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  url: "https://grafana.com/api/dashboards/17547/revisions/latest/download"
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "Mimir"
---

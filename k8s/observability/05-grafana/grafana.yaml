apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    dashboards: grafana
spec:
  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              envFrom:
                - secretRef:
                    name: grafana-oauth-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
  config:
    server:
      root_url: "https://homelab.local/grafana/"
      domain: ""
      serve_from_sub_path: "true"
    database:
      type: postgres
      host: postgres-cluster-rw.database.svc:5432
      name: grafana
      user: grafana
      password: grafana123
    security:
      admin_user: admin
      admin_password: admin
    log:
      mode: console
    auth.generic_oauth:
      enabled: "true"
      name: Authentik
      allow_sign_up: "true"
      scopes: openid profile email
      auth_url: https://homelab.local/authentik/application/o/authorize/
      token_url: http://authentik-server.infra.svc/authentik/application/o/token/
      api_url: http://authentik-server.infra.svc/authentik/application/o/userinfo/
      client_id: "${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}"
      client_secret: "${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
      role_attribute_path: "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"

controller:
  type: daemonset
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

rbac:
  rules:
    - apiGroups: ["", "discovery.k8s.io", "networking.k8s.io"]
      resources: ["endpoints", "endpointslices", "ingresses", "pods", "services"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods", "pods/log", "namespaces"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes", "nodes/proxy", "nodes/metrics"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["monitoring.coreos.com"]
      resources: ["prometheusrules"]
      verbs: ["get", "list", "watch"]

alloy:
  # loki.source.kubernetes は public-preview
  stabilityLevel: "public-preview"

  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi

  configMap:
    content: |-
      // ── Metrics: kubelet (node) → Mimir ────────────────────────────────────────
      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          target_label = "__address__"
          replacement  = "kubernetes.default.svc:443"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
          replacement   = "/api/v1/nodes/$1/proxy/metrics"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      prometheus.scrape "kubelet" {
        targets    = discovery.relabel.kubelet.output
        scheme     = "https"
        tls_config {
          ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          insecure_skip_verify = true
        }
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        forward_to        = [prometheus.remote_write.mimir.receiver]
      }

      // ── Metrics: cAdvisor (container) → Mimir ──────────────────────────────────
      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          target_label = "__address__"
          replacement  = "kubernetes.default.svc:443"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
          replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      prometheus.scrape "cadvisor" {
        targets    = discovery.relabel.cadvisor.output
        scheme     = "https"
        tls_config {
          ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          insecure_skip_verify = true
        }
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        forward_to        = [prometheus.remote_write.mimir.receiver]
      }

      // ── Metrics: annotated pods → Mimir ────────────────────────────────────────
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods_metrics" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          action        = "keep"
          regex         = "true"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          target_label  = "__metrics_path__"
          regex         = "(.+)"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      prometheus.scrape "pods" {
        targets    = discovery.relabel.pods_metrics.output
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Metrics: kube-state-metrics → Mimir ───────────────────────────────
      discovery.kubernetes "ksm" {
        role = "endpoints"
        namespaces {
          names = ["observability"]
        }
      }

      discovery.relabel "ksm" {
        targets = discovery.kubernetes.ksm.targets

        rule {
          source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "kube-state-metrics"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "kube_state_metrics" {
        targets    = discovery.relabel.ksm.output
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Metrics: node (unix exporter) → Mimir ──────────────────────────────
      prometheus.exporter.unix "node" {
        enable_collectors = ["cpu", "meminfo", "filesystem", "netdev", "diskstats", "loadavg", "stat", "uname"]
      }

      prometheus.scrape "node_exporter" {
        targets    = prometheus.exporter.unix.node.targets
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Metrics: apiserver → Mimir ─────────────────────────────────────────────
      discovery.relabel "apiserver" {
        targets = [{
          __address__ = "kubernetes.default.svc:443",
          __metrics_path__ = "/metrics",
          __scheme__ = "https",
        }]

        rule {
          target_label = "job"
          replacement  = "kubernetes-apiservers"
        }
      }

      prometheus.scrape "apiserver" {
        targets           = discovery.relabel.apiserver.output
        tls_config {
          ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          insecure_skip_verify = false
        }
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        forward_to        = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://mimir-gateway.observability.svc/api/v1/push"
        }
      }

      // ── Logs: all pods on this node → Loki ─────────────────────────────────────
      discovery.kubernetes "log_pods" {
        role = "pod"
      }

      discovery.relabel "log_pods" {
        targets = discovery.kubernetes.log_pods.targets

        // このノード上の pod のみ収集
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          action        = "keep"
          regex         = env("HOSTNAME")
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
          separator     = "/"
          target_label  = "job"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.log_pods.output
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki-gateway.observability.svc/loki/api/v1/push"
        }
      }

      // ── Traces: OTLP receiver → Tempo ──────────────────────────────────────────
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo-distributor.observability.svc:4317"
          tls {
            insecure = true
          }
        }
      }

      // ── Rules: PrometheusRule CRD → Mimir Ruler ────────────────────────────────
      mimir.rules.kubernetes "default" {
        address   = "http://mimir-ruler.observability.svc:8080"
        tenant_id = "anonymous"
      }

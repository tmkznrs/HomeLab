config:
  baseURL: /headlamp
  oidc:
    clientID: "<HEADLAMP_CLIENT_ID>"
    clientSecret: "<HEADLAMP_CLIENT_SECRET>"
    issuerURL: "https://homelab.local/authentik/application/o/headlamp/"
    scopes: "openid profile email offline_access"
  extraArgs:
    - "-oidc-ca-file=/etc/ssl/certs/homelab-ca.crt"
volumes:
  - name: homelab-ca
    configMap:
      name: homelab-ca
volumeMounts:
  - name: homelab-ca
    mountPath: /etc/ssl/certs/homelab-ca.crt
    subPath: ca.crt
service:
  type: ClusterIP
  port: 80
